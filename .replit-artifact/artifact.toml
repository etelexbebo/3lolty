kind = "web"
previewPath = "/"
title = "Love Museum - متحف حبنا"
version = "1.0.0"
id = "artifacts/love-museum"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21686

[services.development]
run = "pnpm --filter @workspace/love-museum run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/love-museum", "run", "build" ]
publicDir = "artifacts/love-museum/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21686"
BASE_PATH = "/"
